name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - name: Run actionlint
        run: ./actionlint -color

  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Install Buf and generators
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.50.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: dart-lang/setup-dart@v1
      - name: Install Dart generator
        run: |
          dart pub global activate protoc_plugin 21.1.2
          echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
      - name: Lint proto
        working-directory: proto
        run: buf lint
      - name: Check proto breaking changes
        if: hashFiles('proto/buf.yaml') != ''
        working-directory: proto
        run: buf breaking --against '.git#branch=main,subdir=proto'
      - name: Generate protobuf code
        working-directory: proto
        run: buf generate
      - name: Tidy modules
        working-directory: core
        run: go mod tidy
      - name: Check formatting
        working-directory: core
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Vet
        working-directory: core
        run: go vet ./...
      - name: Test
        working-directory: core
        run: go test -race ./...

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create missing Flutter platforms
        run: |
          rm -rf /tmp/sora-platforms
          mkdir -p /tmp/sora-platforms
          flutter create --platforms=windows,linux,android --org one.levvs --project-name sora --no-pub /tmp/sora-platforms
          mkdir -p app
          cp -R /tmp/sora-platforms/windows app/windows
          cp -R /tmp/sora-platforms/linux app/linux
          cp -R /tmp/sora-platforms/android/. app/android.generated/
          rm -rf app/android.generated/tunnel
          cp -R app/android.generated/. app/android/
          rm -rf app/android.generated
      - name: Get dependencies
        working-directory: app
        run: flutter pub get
      - name: Generate localizations
        working-directory: app
        run: flutter gen-l10n
      - name: Check Dart formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        working-directory: app
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: app
        run: flutter test
