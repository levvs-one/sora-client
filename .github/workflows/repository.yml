name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - name: Run actionlint
        run: ./actionlint -color

  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Install Buf
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.50.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint proto
        working-directory: proto
        run: buf lint
      - name: Check proto breaking changes
        shell: bash
        run: |
          if git ls-tree -r --name-only origin/main | grep -q '^proto/'; then
            # buf clones the local repository, and a pull request checkout has
            # no local main branch, only the remote one.
            git show-ref --verify --quiet refs/heads/main || git branch main origin/main
            buf breaking proto --against '.git#branch=main,subdir=proto'
          else
            echo 'No proto directory exists on main; skipping breaking check.'
          fi

  go:
    name: Go core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Install Buf and Go generators
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.50.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        working-directory: .
      # Only the Go code is generated here: the Dart plugin needs the Dart SDK,
      # and the autofix workflow keeps the Dart code current.
      - name: Generate protobuf code
        working-directory: proto
        run: >-
          buf generate --template
          '{"version":"v2","plugins":[{"local":"protoc-gen-go","out":"../core/gen","opt":"paths=source_relative"},{"local":"protoc-gen-go-grpc","out":"../core/gen","opt":"paths=source_relative"}]}'
      - name: Generated code is current
        run: git diff --exit-code -- gen
      - name: Tidy modules
        run: go mod tidy
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          # Built with a Go new enough for the go directive of core/go.mod.
          version: v2.14.0
          working-directory: core

  app:
    name: App
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - name: Get packages
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build for Linux
        run: flutter build linux --release

  windows:
    name: Windows
    # The whole chain on a real Windows: build, install the service with the
    # installer, reach it from the app over the named pipe, uninstall.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Build the core
        working-directory: core
        shell: bash
        run: CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o ../dist/windows/sora-core.exe ./cmd/sora-core
      - name: Fetch and verify the engines
        shell: bash
        run: packaging/engines/fetch.sh windows-amd64 dist/windows/engines
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.6
          channel: stable
      - name: Build the app
        working-directory: app
        run: |
          flutter pub get
          flutter build windows --release --dart-define=SORA_VERSION=0.0.0-${{ github.run_number }}
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /DAppVersion=0.0.0.${{ github.run_number }} packaging\windows\sora.iss
      - name: Install silently and check the service
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\Sora-Setup-*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/LOG=install.log' -Wait
          $service = Get-Service SoraCore -ErrorAction SilentlyContinue
          if (-not $service -or $service.Status -ne 'Running') { Get-Content install.log; throw "SoraCore is not running" }
      - name: The app reaches the installed core over the pipe
        working-directory: app
        env:
          SORA_CORE_LIVE: "1"
          SORA_CORE_ENGINES: sing-box,xray,mihomo
        run: flutter test test/live_core_test.dart
      - name: Uninstall
        shell: pwsh
        run: |
          Start-Process "${env:ProgramFiles}\Sora\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES' -Wait
          Start-Sleep -Seconds 3
          if (Get-Service SoraCore -ErrorAction SilentlyContinue) { throw "the service outlived the uninstaller" }
      - uses: actions/upload-artifact@v6
        with:
          name: sora-windows-x64
          path: dist/Sora-Setup-*.exe
          if-no-files-found: error

  linux-packages:
    name: Linux packages
    # zapret is C linked against the distribution's netfilter libraries, so
    # each architecture is built natively on its own runner.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Build the core
        working-directory: core
        run: CGO_ENABLED=0 go build -trimpath -ldflags '-s -w' -o ../dist/sora-core ./cmd/sora-core
      - name: Fetch and verify the engines
        run: packaging/engines/fetch.sh ${{ matrix.arch }} dist/engines
      - name: Build zapret
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcap-dev libnetfilter-queue-dev libnfnetlink-dev libmnl-dev zlib1g-dev
          packaging/zapret/build.sh dist/engines
      # Flutter publishes no Linux SDK for arm64 hosts, so the desktop app is
      # packaged for amd64 only; the core and engines are built for both.
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'amd64'
        with:
          flutter-version: 3.47.6
          channel: stable
      - name: Build the app
        if: matrix.arch == 'amd64'
        working-directory: app
        run: |
          sudo apt-get install -y -qq clang cmake ninja-build pkg-config libgtk-3-dev
          flutter pub get
          flutter build linux --release --dart-define=SORA_VERSION=0.0.0~${{ github.run_number }}
      - name: Package
        env:
          SORA_ARCH: ${{ matrix.arch }}
          SORA_VERSION: 0.0.0~${{ github.run_number }}
        run: |
          configs=(packaging/linux/nfpm.yaml)
          if [ "$SORA_ARCH" = amd64 ]; then configs+=(packaging/linux/nfpm-app.yaml); fi
          for config in "${configs[@]}"; do
            for packager in deb rpm archlinux; do
              nfpm package --config "$config" --packager "$packager" --target dist/
            done
          done
      - uses: actions/upload-artifact@v6
        with:
          name: sora-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst
          if-no-files-found: error
