name: Autofix generated code

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter files
        working-directory: app
        run: |
          flutter pub get
          dart format .
          flutter gen-l10n
          rm -rf /tmp/sora-platforms
          mkdir -p /tmp/sora-platforms
          flutter create --platforms=windows,linux,android --org one.levvs --project-name sora --no-pub /tmp/sora-platforms
          mkdir -p android.generated
          cp -R /tmp/sora-platforms/windows windows
          cp -R /tmp/sora-platforms/linux linux
          cp -R /tmp/sora-platforms/android/. android.generated/
          rm -rf android.generated/tunnel
          cp -R android.generated/. android/
          rm -rf android.generated
      - name: Commit generated changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: autofix generated code"
          git push
