name: Repository checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install actionlint
        run: bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - name: Run actionlint
        run: ./actionlint -color

  proto:
    name: Proto
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: Install Buf
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.50.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Lint proto
        working-directory: proto
        run: buf lint
      - name: Check proto breaking changes
        shell: bash
        run: |
          if git ls-tree -r --name-only origin/main | grep -q '^proto/'; then
            buf breaking --against '.git#branch=main,subdir=proto'
          else
            echo 'No proto directory exists on main; skipping breaking check.'
          fi

  go:
    name: Go core
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false
      - name: Install Buf and Go generators
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.50.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
        working-directory: .
      - name: Generate protobuf code
        working-directory: proto
        run: buf generate --template buf.gen.go.yaml
      - name: Tidy modules
        run: go mod tidy
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.1.6
          working-directory: core
