include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 120

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/src/generated/**"
    - build/**
    - android/**
    - linux/**
    - windows/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - cancel_subscriptions
    - close_sinks
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
    - use_super_parameters
