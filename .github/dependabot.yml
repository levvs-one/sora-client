# Dependency updates for the whole monorepo. Grouped by ecosystem so a routine
# bump is one review instead of twenty, and separated by security scope so an
# advisory lands on its own.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /core
    schedule:
      interval: weekly
      day: monday
      time: '06:40'
    open-pull-requests-limit: 5
    groups:
      go-core:
        patterns: ['*']
        exclude-patterns: ['golang.org/x/*']
      go-tooling:
        patterns: ['golang.org/x/*']
    labels: ['dependencies', 'core']
    ignore:
      # grpc 1.84 still carries GO-2026-6443, fixed on 1.83.2 and on the 1.85
      # development line; remove this once a fixed 1.84 or 1.85 is released.
      - dependency-name: google.golang.org/grpc
        versions: ['1.84.x']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:50'
    groups:
      actions:
        patterns: ['*']
    labels: ['dependencies', 'ci']

  - package-ecosystem: nuget
    directory: /legacy/v2rayN
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels: ['dependencies', 'legacy']
