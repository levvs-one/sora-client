name: Предложить улучшение
description: Чего не хватает в Sora или что можно сделать удобнее
title: "[Идея]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Какую проблему нужно решить
      description: Опишите ситуацию пользователя, а не только желаемую кнопку или настройку.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Предлагаемое решение
      description: Как должно выглядеть ожидаемое поведение.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Альтернативы
      description: Что вы уже пробовали или рассматривали.
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Проверка
      options:
        - label: Я проверил, что такого предложения ещё нет в issues.
          required: true
